<audio id="player-audio" preload="metadata"></audio>
<p class="player-eyebrow">Now Playing</p>
<div id="player-track-info" class="player-track-info">
  <span id="player-title" class="player-title">&nbsp;</span>
  <span id="player-artist" class="player-artist"></span>
</div>
<div class="player-controls">
  <button id="player-prev" class="player-btn" type="button" aria-label="Previous track">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12 19 6v12z"></path></svg>
  </button>
  <button id="player-toggle" class="player-btn player-btn-main" type="button" aria-label="Play">
    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg>
  </button>
  <button id="player-next" class="player-btn" type="button" aria-label="Next track">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM5 6l9.5 6L5 18z"></path></svg>
  </button>
</div>
<div class="player-volume">
  <button id="player-mute" class="player-btn" type="button" aria-label="Mute">
    <svg class="icon-sound" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9zM16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4Z"></path></svg>
    <svg class="icon-muted" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9zM19.5 12l2-2-1-1-2 2-2-2-1 1 2 2-2 2 1 1 2-2 2 2 1-1z"></path></svg>
  </button>
  <input id="player-volume-slider" type="range" min="0" max="100" value="50" aria-label="Volume" />
  <button id="player-queue-toggle" class="player-btn" type="button" aria-label="Show queue">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h10"></path>
    </svg>
  </button>
</div>
<ul id="player-queue" class="player-queue" hidden></ul>
