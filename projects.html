<!DOCTYPE html>

<head>

  <script>
    (function () {

      }
    })();
  </script>

      <div id="projects-grid" class="projects-list">
        <p class="loading">Loading projects&hellip;</p>
      </div>

  <footer class="site-footer" data-include="partials/footer.html"></footer>

  <div id="player-bar" data-include="partials/player.html" hidden></div>
