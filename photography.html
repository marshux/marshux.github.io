<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography &mdash; Marshal Xu</title>
  <link rel="icon" href="https://github.com/marshux.png" />
  <script>
    (function () {
      var stored = localStorage.getItem("marshux-theme");
      if (stored === "light" || stored === "dark") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" data-include="partials/nav.html"></header>

  <main>
    <section class="section section--first">
      <h1 data-type>Photography</h1>
      <div class="photo-intro">
        <p class="photo-gear" data-reveal><span class="photo-gear-label">Camera</span>Fujifilm X100VI</p>
        <p class="photo-note" data-reveal>
          I like capturing everyday moments as much as scenic landscapes. I
          grew up in the Pacific Northwest, shooting on my mom's little
          digital camera. In high school and college I took classes in film
          and digital photography, along with photo editing and printing.
        </p>
      </div>
      <div id="photo-grid" class="photo-grid"></div>
    </section>
  </main>

  <footer class="site-footer" data-include="partials/footer.html"></footer>

  <div id="player-bar" data-include="partials/player.html" hidden></div>

  <script src="js/include.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/player.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
